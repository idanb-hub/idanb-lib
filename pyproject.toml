[project]
name = "idanb-lib"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anywidget>=0.9.21",
    "humanize>=4.15.0",
    "ipykernel>=7.1.0",
    "ipymui",
    "ipython>=9.9.0",
    "itables[widget]>=2.6.2",
    "perspective-python>=4.0.1",
    "polars[pyarrow]>=1.37.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "reacton>=1.9.1",
    "service-connectors-v2[intelowl,trino]",
    "structlog>=25.5.0",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "typing-extensions>=4.15.0",
]

[tool.pyright]
venv = ".venv"
venvPath = "."
# We're using `typing-extensions` for everything.
deprecateTypingAliases = false
# Doesn't work well with Reacton components.
reportUnusedCallResult = false

[[tool.uv.index]]
name = "ipymui"
url = "https://codeberg.org/api/packages/steovd/pypi/simple/"

[tool.uv.sources]
service-connectors-v2 = { git = "https://github.com/idanb-hub/service-connectors.git" }
ipymui = { index = "ipymui" }
